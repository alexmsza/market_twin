[package]
name = "market_twin_engine"
version = "0.1.0"
edition = "2021"
description = "Motor Nativo Ultra-Rápido de Simulação Monte Carlo e Micro-Econometria para Market Twin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
