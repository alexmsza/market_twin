[project]
name = "market-twin"
version = "0.1.0"
description = "Simulador de População Sintética e Validação de Mercado com 10.000+ Clones Virtuais via Micro-Econometria Monte Carlo e LLM/SLM Cohort Focus Groups."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "jinja2>=3.1.0",
    "reportlab>=4.2.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
market-twin = "market_twin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_twin"]

